<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova Drive</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
}

#info{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:10px;
}

#speedometer{
    position:fixed;
    top:10px;
    right:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:10px;
}

#rpm{
    position:fixed;
    top:60px;
    right:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:10px;
}
</style>
</head>
<body>

<div id="info">
WASD TO DRIVE
</div>

<div id="speedometer">
Speed: 0 km/h
</div>

<div id="rpm">
RPM: 800
</div>

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.166.1/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

// LIGHT

const sun =
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
20,
30,
10
);

scene.add(sun);

scene.add(
new THREE.AmbientLight(
0xffffff,
1
)
);

// GROUND

const ground =
new THREE.Mesh(

new THREE.PlaneGeometry(
5000,
5000
),

new THREE.MeshLambertMaterial({
color:0x55aa55
})

);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

// ROAD

const road =
new THREE.Mesh(

    new THREE.BoxGeometry(
        20,
        0.1,
        5000
    ),

    new THREE.MeshLambertMaterial({
        color:0x222222
    })

);

road.position.y = 0.05;

scene.add(road);

// SIDEWALKS

const leftSidewalkNorth =
new THREE.Mesh(

    new THREE.BoxGeometry(
        10,
        0.12,
        1980
    ),

    new THREE.MeshLambertMaterial({
        color:0x555555
    })

);

leftSidewalkNorth.position.set(
    -15,
    0.06,
    -1010
);

scene.add(leftSidewalkNorth);

const leftSidewalkSouth =
new THREE.Mesh(

    new THREE.BoxGeometry(
        10,
        0.12,
        2520
    ),

    new THREE.MeshLambertMaterial({
        color:0x555555
    })

);

leftSidewalkSouth.position.set(
    -15,
    0.06,
    1240
);

scene.add(leftSidewalkSouth);

const rightSidewalkNorth =
leftSidewalkNorth.clone();

rightSidewalkNorth.position.x = 15;

scene.add(rightSidewalkNorth);

const rightSidewalkSouth =
leftSidewalkSouth.clone();

rightSidewalkSouth.position.x = 15;

scene.add(rightSidewalkSouth);

// VERTICAL CENTER LINE

for(
    let z=-2490;
    z<=2490;
    z+=12
){

    if(
        z > 400 &&
        z < 450
    ) continue;

    const line =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            0.3,
            0.11,
            6
        ),

        new THREE.MeshLambertMaterial({
            color:0xffffff
        })

    );

    line.position.set(
        0,
        0.11,
        z
    );

    scene.add(line);

}

// CROSS ROAD

const crossRoad =
new THREE.Mesh(

    new THREE.BoxGeometry(
        5000,
        0.1,
        20
    ),

    new THREE.MeshLambertMaterial({
        color:0x222222
    })

);

crossRoad.position.set(
    0,
    0.05,
    425
);

scene.add(crossRoad);

// HORIZONTAL SIDEWALKS

const topSidewalkLeft =
new THREE.Mesh(

    new THREE.BoxGeometry(
        2400,
        0.12,
        10
    ),

    new THREE.MeshLambertMaterial({
        color:0x555555
    })

);

topSidewalkLeft.position.set(
    -1300,
    0.06,
    440
);

scene.add(topSidewalkLeft);

const topSidewalkRight =
topSidewalkLeft.clone();

topSidewalkRight.position.x =
1300;

scene.add(topSidewalkRight);

const bottomSidewalkLeft =
new THREE.Mesh(

    new THREE.BoxGeometry(
        2400,
        0.12,
        10
    ),

    new THREE.MeshLambertMaterial({
        color:0x555555
    })

);

bottomSidewalkLeft.position.set(
    -1300,
    0.06,
    410
);

scene.add(bottomSidewalkLeft);

const bottomSidewalkRight =
bottomSidewalkLeft.clone();

bottomSidewalkRight.position.x =
1300;

scene.add(bottomSidewalkRight);

// HORIZONTAL CENTER LINE

for(
    let x=-2490;
    x<=2490;
    x+=12
){

    if(
        x > -25 &&
        x < 25
    ) continue;

    const line =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            6,
            0.11,
            0.3
        ),

        new THREE.MeshLambertMaterial({
            color:0xffffff
        })

    );

    line.position.set(
        x,
        0.11,
        425
    );

    scene.add(line);

}

// CROSSWALK NORTH

for(
    let x=-8;
    x<=8;
    x+=2
){

    const stripe =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            0.12,
            4
        ),

        new THREE.MeshLambertMaterial({
            color:0xffffff
        })

    );

    stripe.position.set(
        x,
        0.12,
        405
    );

    scene.add(stripe);

}

// CROSSWALK SOUTH

for(
    let x=-8;
    x<=8;
    x+=2
){

    const stripe =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            0.12,
            4
        ),

        new THREE.MeshLambertMaterial({
            color:0xffffff
        })

    );

    stripe.position.set(
        x,
        0.12,
        445
    );

    scene.add(stripe);

}

// CROSSWALK WEST

for(
    let z=417;
    z<=433;
    z+=2
){

    const stripe =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            4,
            0.12,
            1
        ),

        new THREE.MeshLambertMaterial({
            color:0xffffff
        })

    );

    stripe.position.set(
        -20,
        0.12,
        z
    );

    scene.add(stripe);

}

// CROSSWALK EAST

for(
    let z=417;
    z<=433;
    z+=2
){

    const stripe =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            4,
            0.12,
            1
        ),

        new THREE.MeshLambertMaterial({
            color:0xffffff
        })

    );

    stripe.position.set(
        20,
        0.12,
        z
    );

    scene.add(stripe);

}

// BUILDINGS

function addBuilding(
    x,
    z,
    floors
){

    const height =
    floors * 6;

    const building =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            25,
            height,
            25
        ),

        new THREE.MeshLambertMaterial({
            color:0x777777
        })

    );

    building.position.set(
        x,
        height/2,
        z
    );

    scene.add(building);

    for(
        let y=6;
        y<height-3;
        y+=6
    ){

        for(
            let i=-10;
            i<=10;
            i+=5
        ){

            const color =
            0xaaddff;

            // FRONT

            const frontWindow =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    1 + Math.random()*3,
                    1 + Math.random()*3,
                    0.3
                ),

                new THREE.MeshLambertMaterial({
                    color:color
                })

            );

            frontWindow.position.set(
                x+i,
                y,
                z+12.7
            );

            scene.add(frontWindow);

            // BACK

            const backWindow =
            frontWindow.clone();

            backWindow.position.z =
            z-12.7;

            scene.add(backWindow);

            // LEFT

            const leftWindow =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    0.3,
                    1 + Math.random()*3,
                    1 + Math.random()*3
                ),

                new THREE.MeshLambertMaterial({
                    color:color
                })

            );

            leftWindow.position.set(
                x-12.7,
                y,
                z+i
            );

            scene.add(leftWindow);

            // RIGHT

            const rightWindow =
            leftWindow.clone();

            rightWindow.position.x =
            x+12.7;

            scene.add(rightWindow);

        }

    }

}

// INTERSECTION TOWERS

addBuilding(
    -40,
    390,
    20
);

addBuilding(
    40,
    390,
    18
);

addBuilding(
    -40,
    460,
    15
);

addBuilding(
    40,
    460,
    12
);

// CITY BUILDINGS

for(
    let z=-2400;
    z<=2400;
    z+=150
){

    addBuilding(
        -45,
        z,
        5 +
        Math.floor(
            Math.random()*11
        )
    );

    addBuilding(
        45,
        z,
        5 +
        Math.floor(
            Math.random()*11
        )
    );

}

// TRAFFIC LIGHTS

function addTrafficLight(x,z){

    const pole =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            0.15,
            0.15,
            5
        ),

        new THREE.MeshLambertMaterial({
            color:0x222222
        })

    );

    pole.position.set(
        x,
        2.5,
        z
    );

    scene.add(pole);

    const arm =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2,
            0.15,
            0.15
        ),

        new THREE.MeshLambertMaterial({
            color:0x222222
        })

    );

    arm.position.set(
        x+1,
        5,
        z
    );

    scene.add(arm);

    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.8,
            0.8,
            0.8
        ),

        new THREE.MeshLambertMaterial({
            color:0x333333
        })

    );

    body.position.set(
        x+2,
        5,
        z
    );

    scene.add(body);

    const green =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.15,
            12,
            12
        ),

        new THREE.MeshBasicMaterial({
            color:0x00ff00
        })

    );

    green.position.set(
        x+1.4,
        5,
        z+0.45

// CAR

const car =
new THREE.Mesh(

new THREE.BoxGeometry(
2,
1,
4
),

new THREE.MeshLambertMaterial({
color:0x808080
})

);

car.position.y = 0.5;

scene.add(car);

// WINDOW

const windowPart =
new THREE.Mesh(

new THREE.BoxGeometry(
1.4,
0.6,
2
),

new THREE.MeshLambertMaterial({
color:0x88ccff
})

);

windowPart.position.set(
0,
0.8,
0
);

car.add(windowPart);

// WHEELS

function makeWheel(x,z){

const wheel =
new THREE.Mesh(

new THREE.CylinderGeometry(
0.5,
0.5,
0.5,
16
),

new THREE.MeshLambertMaterial({
color:0x111111
})

);

wheel.rotation.z =
Math.PI / 2;

wheel.position.set(
x,
0.5,
z
);

car.add(wheel);

}

makeWheel(-1.1, 1.5);
makeWheel( 1.1, 1.5);
makeWheel(-1.1,-1.5);
makeWheel( 1.1,-1.5);

// CONTROLS

const keys = {};

window.addEventListener(
"keydown",
e=>{
keys[
e.key.toLowerCase()
] = true;
}
);

window.addEventListener(
"keyup",
e=>{
keys[
e.key.toLowerCase()
] = false;
}
);

let speed = 0;
const maxSpeed = 180;

function drive(){

if(keys["w"]){

speed += 0.3;

}

if(keys["s"]){

speed -= 0.4;

}

if(speed > maxSpeed){

speed = maxSpeed;

}

if(speed < -30){

speed = -30;

}

speed *= 0.995;

if(keys["a"]){

car.rotation.y +=
0.002 *
Math.abs(speed);

}

if(keys["d"]){

car.rotation.y -=
0.002 *
Math.abs(speed);

}

car.position.x +=
Math.sin(
car.rotation.y
)
*
speed
*
0.01;

car.position.z +=
Math.cos(
car.rotation.y
)
*
speed
*
0.01;

}

// CAMERA

function updateCamera(){

camera.position.x =
car.position.x -
Math.sin(
car.rotation.y
) * 8;

camera.position.y = 5;

camera.position.z =
car.position.z -
Math.cos(
car.rotation.y
) * 8;

camera.lookAt(
car.position
);

}

// RESIZE

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

// LOOP

function animate(){

requestAnimationFrame(
animate
);

drive();

updateCamera();

document.getElementById(
"speedometer"
).textContent =

"Speed: " +
Math.round(
Math.abs(speed)
) +
" km/h";

const rpm =
800 +
Math.abs(speed)
* 35;

document.getElementById(
"rpm"
).textContent =

"RPM: " +
Math.round(rpm);

renderer.render(
scene,
camera
);

}

animate();

</script>

</body>
</html>
