<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nova Drive</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
}

#info{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:10px;
}

#speedometer{
    position:fixed;
    top:10px;
    right:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:10px;
}

#rpm{
    position:fixed;
    top:60px;
    right:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:10px;
    border-radius:10px;
}
</style>
</head>
<body>

<div id="info">
WASD TO DRIVE
</div>

<div id="speedometer">
Speed: 0 km/h
</div>

<div id="rpm">
RPM: 800
</div>

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.166.1/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

// LIGHT

const sun =
new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
20,
30,
10
);

scene.add(sun);

scene.add(
new THREE.AmbientLight(
0xffffff,
1
)
);

// GROUND

const ground =
new THREE.Mesh(

new THREE.PlaneGeometry(
500,
500
),

new THREE.MeshLambertMaterial({
color:0x55aa55
})

);

ground.rotation.x =
-Math.PI/2;

scene.add(ground);

// ROAD

const road =
new THREE.Mesh(

new THREE.BoxGeometry(
20,
0.1,
500
),

new THREE.MeshLambertMaterial({
color:0x222222
})

);

road.position.y = 0.05;

scene.add(road);

// CENTER LINE

for(
let z=-240;
z<=240;
z+=12
){

const line =
new THREE.Mesh(

new THREE.BoxGeometry(
0.3,
0.11,
6
),

new THREE.MeshLambertMaterial({
color:0xffffff
})

);

line.position.set(
0,
0.11,
z
);

scene.add(line);

}

// CAR

const car =
new THREE.Mesh(

new THREE.BoxGeometry(
2,
1,
4
),

new THREE.MeshLambertMaterial({
color:0x808080
})

);

car.position.y = 0.5;

scene.add(car);

// WINDOW

const windowPart =
new THREE.Mesh(

new THREE.BoxGeometry(
1.4,
0.6,
2
),

new THREE.MeshLambertMaterial({
color:0x88ccff
})

);

windowPart.position.set(
0,
0.8,
0
);

car.add(windowPart);

// WHEELS

function makeWheel(x,z){

const wheel =
new THREE.Mesh(

new THREE.CylinderGeometry(
0.5,
0.5,
0.5,
16
),

new THREE.MeshLambertMaterial({
color:0x111111
})

);

wheel.rotation.z =
Math.PI / 2;

wheel.position.set(
x,
0.5,
z
);

car.add(wheel);

}

makeWheel(-1.1, 1.5);
makeWheel( 1.1, 1.5);
makeWheel(-1.1,-1.5);
makeWheel( 1.1,-1.5);

// CONTROLS

const keys = {};

window.addEventListener(
"keydown",
e=>{
keys[
e.key.toLowerCase()
] = true;
}
);

window.addEventListener(
"keyup",
e=>{
keys[
e.key.toLowerCase()
] = false;
}
);

let speed = 0;
const maxSpeed = 180;

function drive(){

if(keys["w"]){

speed += 1.5;

}

if(keys["s"]){

speed -= 0.6;

}

if(speed > maxSpeed){

speed = maxSpeed;

}

if(speed < -30){

speed = -30;

}

speed *= 0.998;

if(keys["a"]){

car.rotation.y +=
0.002 *
Math.abs(speed);

}

if(keys["d"]){

car.rotation.y -=
0.002 *
Math.abs(speed);

}

car.position.x +=
Math.sin(
car.rotation.y
)
*
speed
*
0.01;

car.position.z +=
Math.cos(
car.rotation.y
)
*
speed
*
0.01;

}

// CAMERA

function updateCamera(){

camera.position.x =
car.position.x -
Math.sin(
car.rotation.y
) * 8;

camera.position.y = 5;

camera.position.z =
car.position.z -
Math.cos(
car.rotation.y
) * 8;

camera.lookAt(
car.position
);

}

// RESIZE

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

// LOOP

function animate(){

requestAnimationFrame(
animate
);

drive();

updateCamera();

document.getElementById(
"speedometer"
).textContent =

"Speed: " +
Math.round(
Math.abs(speed)
) +
" km/h";

const rpm =
800 +
Math.abs(speed)
* 35;

document.getElementById(
"rpm"
).textContent =

"RPM: " +
Math.round(rpm);

renderer.render(
scene,
camera
);

}

animate();

</script>

</body>
</html>
